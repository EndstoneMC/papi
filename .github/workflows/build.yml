name: Build

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-linux:
    name: Native (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Clang 20
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y clang-format-20 clang-tidy-20 libc++-20-dev libc++abi-20-dev
          sudo ln -sf /usr/bin/clang-20 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-20 /usr/local/bin/clang++
          clang --version | grep -E "clang version 20\\."

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: python -m pip install "conan>=2,<3"

      - name: Cache Conan packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .conan2
          key: ${{ runner.os }}-clang20-conan-${{ hashFiles('conanfile.py', '.conan2/profiles/default') }}

      - name: Install dependencies
        run: conan install . --build=missing

      - name: Configure
        run: cmake --preset papi-dev -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build --preset papi-dev

      - name: Run tests
        run: ctest --preset papi-dev --output-on-failure

      - name: Install Python test dependencies
        run: python -m pip install "endstone==0.11.8" pytest

      - name: Stage native module for Python tests
        shell: bash
        run: cp build/RelWithDebInfo/_papi*.so endstone_papi/ 2>/dev/null || true

      - name: Run Python tests
        run: python -m pytest -q

      - name: Check formatting
        run: git ls-files '*.cpp' '*.h' | xargs clang-format-20 --dry-run --Werror

      - name: Run clang-tidy
        run: python tools/run_clang_tidy.py --build-dir build/RelWithDebInfo --clang-tidy clang-tidy-20

      - name: Architecture boundaries
        run: python tests/test_architecture_boundaries.py

      - name: Changelog tooling tests
        run: python tools/test_release_changelog.py

  native-windows:
    name: Native (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4
        with:
          arch: x64

      - name: Select clang-cl 20
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = & "$llvmBin\clang-cl.exe" --version
          $version
          if (-not ($version | Select-String "clang version 20\.")) {
            throw "clang-cl 20 is required"
          }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: python -m pip install "conan>=2,<3"

      - name: Cache Conan packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .conan2
          key: ${{ runner.os }}-clang20-conan-${{ hashFiles('conanfile.py', '.conan2/profiles/default') }}

      - name: Install dependencies
        run: conan install . --build=missing

      - name: Configure
        run: cmake --preset papi-dev -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build --preset papi-dev

      - name: Run tests
        run: ctest --preset papi-dev --output-on-failure

      - name: Install Python test dependencies
        run: python -m pip install "endstone==0.11.8" pytest

      - name: Stage native module for Python tests
        shell: bash
        run: cp build/RelWithDebInfo/_papi*.pyd endstone_papi/ 2>/dev/null || true

      - name: Run Python tests
        run: python -m pytest -q

      - name: Check formatting
        shell: pwsh
        run: |
          $files = git ls-files '*.cpp' '*.h'
          & clang-format --dry-run --Werror $files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run clang-tidy
        run: python tools/run_clang_tidy.py --build-dir build/RelWithDebInfo --clang-tidy clang-tidy

      - name: Architecture boundaries
        run: python tests/test_architecture_boundaries.py

  python:
    name: Python
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

  wheel:
    name: Wheel (${{ matrix.python-tag }}-${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, windows-latest ]
        python-tag: [ "cp310", "cp311", "cp312", "cp313", "cp314" ]
        include:
          - os: ubuntu-22.04
            platform: manylinux_x86_64
          - os: windows-latest
            platform: win_amd64
          - python-tag: "cp310"
            python-version: "3.10"
          - python-tag: "cp311"
            python-version: "3.11"
          - python-tag: "cp312"
            python-version: "3.12"
          - python-tag: "cp313"
            python-version: "3.13"
          - python-tag: "cp314"
            python-version: "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4
        with:
          arch: x64

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Build wheels
        uses: pypa/cibuildwheel@d16cc544083d96996f923fc4b318fee3cb14b34e # v3.4.1
        env:
          CIBW_BUILD: ${{ matrix.python-tag }}-${{ matrix.platform }}
          CIBW_BUILD_VERBOSITY: 1
          CIBW_CONTAINER_ENGINE: "docker; create_args: --volume ${{ github.workspace }}/.conan2:/project/.conan2"

      - name: Reclaim Conan home (Linux)
        if: always() && runner.os == 'Linux'
        run: sudo chown -R "$(id -u):$(id -g)" .conan2

      - name: Verify wheel contents
        shell: bash
        run: |
          python -c "
          import zipfile, sys, pathlib
          whl = list(pathlib.Path('wheelhouse').glob('*.whl'))[0]
          z = zipfile.ZipFile(whl)
          names = z.namelist()
          assert any('_papi' in n for n in names), 'native module missing'
          assert any(n.endswith('.pyi') for n in names), '.pyi missing'
          assert any('include/endstone_papi' in n for n in names), 'headers missing'
          assert any('LICENSE' in n for n in names), 'LICENSE missing'
          print(f'OK: {len(names)} files in {whl.name}')
          "

      - name: Set up Python for runtime test
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Runtime smoke test
        shell: bash
        run: |
          python -m pip install endstone==0.11.8
          whl="$(python -c 'import pathlib; print(list(pathlib.Path("wheelhouse").glob("*.whl"))[0])')"
          python -m pip install --no-deps "$whl"
          # Diagnose libc++ resolution on manylinux wheels.
          _site="$(python -c 'import site; print(site.getsitepackages()[0])')"
          _papi="$(ls "$_site"/endstone_papi/_papi*.so 2>/dev/null | head -1)"
          echo "=== _papi.so path ==="
          echo "$_papi"
          echo "=== readelf -d ==="
          readelf -d "$_papi" 2>&1 || true
          echo "=== ldd ==="
          ldd "$_papi" 2>&1 || true
          echo "=== endstone.libs ==="
          ls -la "$_site/endstone.libs/" 2>&1 || echo "no endstone.libs"
          echo "=== endstone_papi dir ==="
          ls -la "$_site/endstone_papi/" 2>&1 || true
          echo "=== LD_LIBRARY_PATH ==="
          echo "$LD_LIBRARY_PATH"
          PAPI_DEBUG=1 python tools/wheel_smoke_test.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: papi-${{ matrix.python-tag }}-${{ matrix.platform }}
          path: ./wheelhouse/*.whl

  sdist:
    name: Sdist
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Verify sdist contains native sources
        shell: bash
        run: |
          python -c "
          import tarfile, pathlib
          sdist = list(pathlib.Path('dist').glob('*.tar.gz'))[0]
          t = tarfile.open(sdist)
          names = t.getnames()
          for required in ['module.cpp', 'gil_safe_proxy.cpp', 'expansion_trampoline.cpp',
                           'bootstrap.cpp', 'placeholder_api_impl.cpp']:
              assert any(required in n for n in names), f'{required} missing from sdist'
          print(f'OK: sdist contains all native sources')
          "

      - name: Install Clang 20
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          sudo apt-get install -y libc++-20-dev libc++abi-20-dev
          sudo ln -sf /usr/bin/clang-20 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-20 /usr/local/bin/clang++
          clang --version | grep -E "clang version 20\\."

      - name: Install Conan and build tools
        run: python -m pip install "conan>=2,<3" cmake ninja scikit-build-core-conan "pybind11>=3.0,<4"

      - name: Build wheel from sdist
        shell: bash
        run: |
          sdist="$(python -c 'import pathlib; print(list(pathlib.Path("dist").glob("*.tar.gz"))[0])')"
          pip wheel --no-deps --no-build-isolation "$sdist" -w wheelhouse/

      - name: Runtime smoke test from sdist-built wheel
        shell: bash
        run: |
          python -m pip install endstone==0.11.8
          whl="$(python -c 'import pathlib; print(list(pathlib.Path("wheelhouse").glob("*.whl"))[0])')"
          python -m pip install --no-deps "$whl"
          python tools/wheel_smoke_test.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: papi-sdist
          path: ./dist/*.tar.gz
