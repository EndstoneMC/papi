name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0)"
        required: true
        type: string
      dry_run:
        description: "Preview without making changes"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare immutable release candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      dry_run: ${{ steps.release_meta.outputs.dry_run }}
      sha: ${{ steps.candidate.outputs.sha }}
      base_sha: ${{ steps.release_meta.outputs.base_sha }}
      candidate_ref: ${{ steps.release_meta.outputs.candidate_ref }}
      published: ${{ steps.release_meta.outputs.published }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate release
        id: release_meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          DRY_RUN="$INPUT_DRY_RUN"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: $VERSION (expected X.Y.Z)"
            exit 1
          fi

          if [[ "$DRY_RUN" != "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Non-dry-run releases must run from main"
            exit 1
          fi

          if [[ "$DRY_RUN" != "true" ]]; then
            git fetch origin main develop --tags
            MAIN_SHA=$(git rev-parse origin/main)
            DEVELOP_SHA=$(git rev-parse origin/develop)
            TAG_SHA=$(git rev-parse --verify --quiet "refs/tags/v$VERSION^{commit}" || true)
            PUBLISHED=false
            if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              PUBLISHED=true
            fi

            if [[ -n "$TAG_SHA" ]]; then
              BASE_SHA=$(git rev-parse "$TAG_SHA^")
              CANDIDATE_SHA="$TAG_SHA"
            else
              BASE_SHA=$(git rev-parse HEAD)
              CANDIDATE_SHA=""
            fi
            # Candidate refs include their base SHA, are never force-updated,
            # and remain as immutable recovery/provenance refs after release.
            CANDIDATE_REF="refs/heads/release-candidates/v$VERSION-$BASE_SHA"
            REMOTE_CANDIDATE_SHA=$(git ls-remote origin "$CANDIDATE_REF" | awk '{print $1}')

            if [[ -n "$TAG_SHA" ]]; then
              if [[ "$MAIN_SHA" != "$TAG_SHA" || "$DEVELOP_SHA" != "$TAG_SHA" ||
                    "$REMOTE_CANDIDATE_SHA" != "$TAG_SHA" ]]; then
                echo "::error::v$VERSION exists but main, develop, and its immutable candidate are not identical"
                exit 1
              fi
            else
              if [[ "$PUBLISHED" == "true" ]]; then
                echo "::error::GitHub Release v$VERSION exists without its production tag"
                exit 1
              fi
              if [[ "$BASE_SHA" != "$MAIN_SHA" || "$BASE_SHA" != "$DEVELOP_SHA" ]]; then
                echo "::error::release ref, main, and develop must point to the same commit before releasing"
                exit 1
              fi
              CANDIDATE_SHA="$REMOTE_CANDIDATE_SHA"
            fi

            echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "candidate_ref=$CANDIDATE_REF" >> "$GITHUB_OUTPUT"
            echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
            echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          else
            if git rev-parse --verify --quiet "refs/tags/v$VERSION"; then
              echo "::error::Tag v$VERSION already exists"
              exit 1
            fi
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

          DATE=$(date -u +%Y-%m-%d)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

      - name: Prepare release preview
        if: env.DRY_RUN == 'true'
        shell: bash
        run: |
          python tools/release_changelog.py \
            --version "$VERSION" \
            --date "$DATE" \
            --repository "${{ github.repository }}" \
            --output /tmp/CHANGELOG.md \
            --notes /tmp/release_body.md
          echo "Release notes:"
          cat /tmp/release_body.md

      - name: Preview
        if: env.DRY_RUN == 'true'
        shell: bash
        run: |
          echo "=== Dry Run ==="
          echo "Ref: ${{ github.ref }}"
          echo "Version: $VERSION"
          echo "Tag: v$VERSION"
          echo "Date: $DATE"
          echo
          echo "=== Current CMake version ==="
          grep -F 'project(papi VERSION ' CMakeLists.txt
          echo
          echo "=== CMake version after update ==="
          echo "project(papi VERSION $VERSION LANGUAGES CXX)"
          echo "(pyproject.toml version is derived dynamically from CMakeLists.txt)"
          echo
          echo "=== Changelog changes ==="
          diff -u CHANGELOG.md /tmp/CHANGELOG.md || true
          echo
          echo "=== Release notes ==="
          cat /tmp/release_body.md

      - name: Prepare or reuse immutable candidate
        id: candidate
        if: env.DRY_RUN != 'true'
        shell: bash
        env:
          BASE_SHA: ${{ steps.release_meta.outputs.base_sha }}
          CANDIDATE_REF: ${{ steps.release_meta.outputs.candidate_ref }}
          CANDIDATE_SHA: ${{ steps.release_meta.outputs.candidate_sha }}
        run: |
          if [[ -n "$CANDIDATE_SHA" ]]; then
            git fetch origin "$CANDIDATE_REF"
            test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_SHA"
            test "$(git rev-parse "$CANDIDATE_SHA^")" = "$BASE_SHA"
            if git rev-parse --verify --quiet "$CANDIDATE_SHA^2"; then
              echo "::error::release candidate must have exactly one parent"
              exit 1
            fi

            mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA")
            if [[ "${changed[*]}" != "CHANGELOG.md CMakeLists.txt" ]]; then
              echo "::error::release candidate may change only CHANGELOG.md and CMakeLists.txt"
              exit 1
            fi

            git show "$CANDIDATE_SHA:CHANGELOG.md" > /tmp/candidate_CHANGELOG.md
            DATE=$(VERSION="$VERSION" python - <<'PY'
          import os
          from pathlib import Path
          from tools.release_changelog import render_version_notes

          date, notes = render_version_notes(Path("/tmp/candidate_CHANGELOG.md").read_text(), os.environ["VERSION"])
          Path("/tmp/release_body.md").write_text(notes)
          print(date)
          PY
            )

            git show "$BASE_SHA:CHANGELOG.md" > /tmp/base_CHANGELOG.md
            git show "$BASE_SHA:CMakeLists.txt" > /tmp/expected_CMakeLists.txt
            python tools/release_changelog.py \
              --version "$VERSION" \
              --date "$DATE" \
              --repository "${{ github.repository }}" \
              --input /tmp/base_CHANGELOG.md \
              --output /tmp/expected_CHANGELOG.md \
              --notes /tmp/expected_release_body.md
            sed -E -i "s/^project\(papi VERSION [0-9]+\.[0-9]+\.[0-9]+ LANGUAGES CXX\)$/project(papi VERSION $VERSION LANGUAGES CXX)/" /tmp/expected_CMakeLists.txt
            git show "$CANDIDATE_SHA:CMakeLists.txt" > /tmp/candidate_CMakeLists.txt
            diff -u /tmp/candidate_CMakeLists.txt /tmp/expected_CMakeLists.txt
            diff -u /tmp/candidate_CHANGELOG.md /tmp/expected_CHANGELOG.md
            diff -u /tmp/expected_release_body.md /tmp/release_body.md
            git checkout --detach "$CANDIDATE_SHA"
          else
            python tools/release_changelog.py \
              --version "$VERSION" \
              --date "$DATE" \
              --repository "${{ github.repository }}" \
              --output /tmp/CHANGELOG.md \
              --notes /tmp/release_body.md
            sed -E -i "s/^project\(papi VERSION [0-9]+\.[0-9]+\.[0-9]+ LANGUAGES CXX\)$/project(papi VERSION $VERSION LANGUAGES CXX)/" CMakeLists.txt
            cp /tmp/CHANGELOG.md CHANGELOG.md
            grep -Fx "project(papi VERSION $VERSION LANGUAGES CXX)" CMakeLists.txt
            test "$(grep -Fc "## [$VERSION]" CHANGELOG.md)" -eq 1
            test -s /tmp/release_body.md
            git diff --check

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CMakeLists.txt CHANGELOG.md
            git commit -m "chore: release v$VERSION"
            CANDIDATE_SHA=$(git rev-parse HEAD)
            git push origin "$CANDIDATE_SHA:$CANDIDATE_REF"
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload release notes
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: /tmp/release_body.md
          if-no-files-found: error

  build-wheels:
    name: Build wheels (${{ matrix.python-tag }}-${{ matrix.platform }})
    if: needs.release.outputs.dry_run != 'true' && needs.release.outputs.published != 'true' && needs.release.outputs.version != ''
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, windows-latest ]
        python-tag: [ "cp310", "cp311", "cp312", "cp313", "cp314" ]
        include:
          - os: ubuntu-22.04
            platform: manylinux_x86_64
          - os: windows-latest
            platform: win_amd64
          - python-tag: "cp310"
            python-version: "3.10"
          - python-tag: "cp311"
            python-version: "3.11"
          - python-tag: "cp312"
            python-version: "3.12"
          - python-tag: "cp313"
            python-version: "3.13"
          - python-tag: "cp314"
            python-version: "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4
        with:
          arch: x64

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Build wheels
        uses: pypa/cibuildwheel@d16cc544083d96996f923fc4b318fee3cb14b34e # v3.4.1
        env:
          CIBW_BUILD: ${{ matrix.python-tag }}-${{ matrix.platform }}
          CIBW_BUILD_VERBOSITY: 1
          CIBW_CONTAINER_ENGINE: "docker; create_args: --volume ${{ github.workspace }}/.conan2:/project/.conan2"

      - name: Reclaim Conan home (Linux)
        if: always() && runner.os == 'Linux'
        run: sudo chown -R "$(id -u):$(id -g)" .conan2

      - name: Set up Python for runtime test
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Runtime smoke test
        shell: bash
        run: |
          python -m pip install endstone==0.11.8
          whl="$(python -c 'import pathlib; print(list(pathlib.Path("wheelhouse").glob("*.whl"))[0])')"
          python -m pip install "$whl"
          python tools/wheel_smoke_test.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-wheels-${{ matrix.python-tag }}-${{ matrix.platform }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    if: needs.release.outputs.dry_run != 'true' && needs.release.outputs.published != 'true' && needs.release.outputs.version != ''
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install build patchelf

      - name: Build sdist
        run: python -m build --sdist

      - name: Verify and isolate sdist archive
        shell: bash
        run: |
          python -c "
          import pathlib, tarfile
          sdist = list(pathlib.Path('dist').glob('*.tar.gz'))
          assert len(sdist) == 1, sdist
          names = tarfile.open(sdist[0]).getnames()
          for required in ['module.cpp', 'gil_safe_proxy.cpp', 'expansion_trampoline.cpp',
                           'bootstrap.cpp', 'placeholder_api_impl.cpp', 'build_linux_runtime.py']:
              assert any(required in name for name in names), f'{required} missing from sdist'
          "
          rm -rf /tmp/papi-sdist-input /tmp/papi-sdist-build /tmp/papi-sdist-smoke /tmp/papi-sdist-wheel
          mkdir /tmp/papi-sdist-input /tmp/papi-sdist-build /tmp/papi-sdist-smoke /tmp/papi-sdist-wheel
          cp dist/*.tar.gz /tmp/papi-sdist-input/
          test "$(find /tmp/papi-sdist-input -maxdepth 1 -type f | wc -l)" -eq 1

      - name: Install Clang 20
        shell: bash
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 20
          /usr/bin/clang-20 --version | grep -E "clang version 20\\."
          tar --wildcards -xOf /tmp/papi-sdist-input/*.tar.gz '*/tools/build_linux_runtime.py' > /tmp/build_linux_runtime.py
          sudo /usr/bin/python3 /tmp/build_linux_runtime.py

      - name: Build checkout wheel through shared backend
        shell: bash
        run: |
          CC=/usr/bin/clang-20 CXX=/usr/bin/clang++-20 \
            python -m build --wheel -o /tmp/papi-checkout-wheel

      - name: Build wheel from isolated sdist archive
        shell: bash
        run: |
          python -m venv /tmp/papi-sdist-build-env
          /tmp/papi-sdist-build-env/bin/python -m pip install \
            "conan==2.30.0" cmake ninja "scikit-build-core-conan==0.9.2" "pybind11==3.0.1" \
            "auditwheel==6.4.2" "endstone==0.11.8" "patchelf==0.17.2.4" "wheel==0.45.1"
          cd /tmp/papi-sdist-build
          CC=/usr/bin/clang-20 CXX=/usr/bin/clang++-20 \
            /tmp/papi-sdist-build-env/bin/pip wheel --no-deps --no-build-isolation \
            /tmp/papi-sdist-input/*.tar.gz -w /tmp/papi-sdist-wheel/

      - name: Verify checkout and sdist wheel runtime contracts
        shell: bash
        run: |
          sdist_wheel="$(find /tmp/papi-sdist-wheel -maxdepth 1 -name '*.whl' -print -quit)"
          checkout_wheel="$(find /tmp/papi-checkout-wheel -maxdepth 1 -name '*.whl' -print -quit)"
          python tools/verify_linux_wheel.py "$sdist_wheel" --compare "$checkout_wheel"
          /tmp/papi-sdist-build-env/bin/python -m auditwheel show "$sdist_wheel"

      - name: Runtime smoke test from isolated sdist-built wheel
        shell: bash
        run: |
          python -m venv /tmp/papi-sdist-smoke-env
          /tmp/papi-sdist-smoke-env/bin/pip install /tmp/papi-sdist-wheel/*.whl
          cd /tmp/papi-sdist-smoke
          /tmp/papi-sdist-smoke-env/bin/python "$GITHUB_WORKSPACE/tools/wheel_smoke_test.py"
          module="$(find /tmp/papi-sdist-smoke-env -path '*site-packages/endstone_papi/_papi*.so' -print -quit)"
          ldd "$module" | tee /tmp/papi-sdist-ldd.txt
          grep -F 'endstone_papi/libc++.so.1' /tmp/papi-sdist-ldd.txt
          grep -F 'endstone_papi/libc++abi.so.1' /tmp/papi-sdist-ldd.txt
          grep -F 'endstone.libs/libunwind-' /tmp/papi-sdist-ldd.txt
          python -c "
          from pathlib import Path
          lines = Path('/tmp/papi-sdist-ldd.txt').read_text().splitlines()
          runtime = [line for line in lines if any(name in line for name in ('libc++.so', 'libc++abi.so', 'libunwind.so'))]
          assert runtime, lines
          assert not any('=> /usr/' in line for line in runtime), runtime
          "
          hashed="$(find /tmp/papi-sdist-smoke-env -path '*site-packages/endstone.libs/libc++-*.so.1.0' -print -quit)"
          test -n "$hashed"
          mv "$hashed" "$hashed.missing"
          if /tmp/papi-sdist-smoke-env/bin/python -c 'import endstone_papi'; then
            echo 'native import unexpectedly succeeded without Endstone libc++' >&2
            exit 1
          fi
          mv "$hashed.missing" "$hashed"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sdist
          path: ./dist/*.tar.gz

  publish:
    name: Publish GitHub Release
    if: needs.release.outputs.dry_run != 'true' && needs.release.outputs.published != 'true' && needs.release.outputs.version != ''
    needs: [release, build-wheels, build-sdist]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -name '*.whl' -exec cp {} release-assets/ \;
          find artifacts -name '*.tar.gz' -exec cp {} release-assets/ \;
          cp artifacts/release-notes/release_body.md release-assets/

      - name: Verify release assets
        shell: bash
        run: |
          # 10 wheels (5 Python versions x 2 platforms) + 1 sdist.
          whl_count=$(find release-assets -name '*.whl' | wc -l)
          sdist_count=$(find release-assets -name '*.tar.gz' | wc -l)
          echo "Wheels: $whl_count"
          echo "Sdists: $sdist_count"
          test "$whl_count" -eq 10
          test "$sdist_count" -eq 1
          test -s release-assets/release_body.md

      - name: Atomically finalize release refs
        shell: bash
        env:
          BASE_SHA: ${{ needs.release.outputs.base_sha }}
          CANDIDATE_REF: ${{ needs.release.outputs.candidate_ref }}
          CANDIDATE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          git fetch origin main develop --tags
          MAIN_SHA=$(git rev-parse origin/main)
          DEVELOP_SHA=$(git rev-parse origin/develop)
          TAG_SHA=$(git rev-parse --verify --quiet "refs/tags/v$VERSION^{commit}" || true)
          REMOTE_CANDIDATE_SHA=$(git ls-remote origin "$CANDIDATE_REF" | awk '{print $1}')

          test "$REMOTE_CANDIDATE_SHA" = "$CANDIDATE_SHA"
          if [[ -z "$TAG_SHA" ]]; then
            test "$MAIN_SHA" = "$BASE_SHA"
            test "$DEVELOP_SHA" = "$BASE_SHA"
            # This is the only production-ref mutation. It occurs after all
            # candidate artifact jobs pass and the complete set is verified.
            git push --atomic origin \
              "$CANDIDATE_SHA:refs/heads/main" \
              "$CANDIDATE_SHA:refs/heads/develop" \
              "$CANDIDATE_SHA:refs/tags/v$VERSION"
          else
            # A previous run finalized refs but failed while creating the GitHub
            # Release. Rebuilding the same immutable candidate converges here.
            test "$TAG_SHA" = "$CANDIDATE_SHA"
            test "$MAIN_SHA" = "$CANDIDATE_SHA"
            test "$DEVELOP_SHA" = "$CANDIDATE_SHA"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          name: v${{ needs.release.outputs.version }}
          body_path: release-assets/release_body.md
          files: |
            release-assets/*.whl
            release-assets/*.tar.gz
          draft: false
          prerelease: false
