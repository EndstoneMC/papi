[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-papi-migration-owner"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["endstone==0.11.11.dev392", "endstone-papi==0.1.0"]
description = "Test-only PAPI migration expansion owner"

[project.entry-points.endstone]
papi_migration_owner = "endstone_papi_migration_owner:MigrationOwner"
