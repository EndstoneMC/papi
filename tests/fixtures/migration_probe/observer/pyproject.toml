[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-papi-migration-observer"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["endstone==0.11.11.dev392", "endstone-papi==0.1.0", "endstone-papi-migration-owner==1.0.0"]
description = "Test-only PAPI migration lifecycle observer"

[project.entry-points.endstone]
papi_migration_observer = "endstone_papi_migration_observer:MigrationObserver"
