[build-system]
# ABI-sensitive build dependencies are pinned for reproducibility. Keep the PEP 517
# pybind11 package in lock-step with the Conan-resolved pybind11/3.0.1 CMake headers,
# and update the CI Conan pin together with this declaration.
requires = ["scikit-build-core-conan==0.9.2", "conan==2.30.0", "pybind11==3.0.1"]
build-backend = "scikit_build_core_conan.build"

[project]
name = "endstone-papi"
dynamic = ["version"]
authors = [
    { name = "Vincent Wu", email = "magicdroidx@gmail.com" },
    { name = "daoge_cmd", email = "3523206925@qq.com" },
]
description = "PlaceholderAPI framework for Endstone, with C++ and Python expansion providers."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["plugin", "python", "c++", "minecraft", "bedrock", "papi", "placeholder"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
# PAPI's native extension links against the same libc++/libc++abi that Endstone
# bundles (Linux) and exchanges C++ objects across the Endstone ABI boundary
# (both platforms). The Linux wheel preserves standard libc++ NEEDED entries and
# ships bridge DSOs that depend on Endstone's hashed SONAMEs, so a compatible
# Endstone runtime must be present at install time.
dependencies = ["endstone>=0.11.8,<0.12"]

[project.urls]
Homepage = "https://github.com/EndstoneMC/papi"
Issues = "https://github.com/EndstoneMC/papi/issues"

[project.entry-points."endstone"]
papi = "endstone_papi:PlaceholderAPIPlugin"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.scikit-build]
cmake.version = ">=3.29"
cmake.args = ["-G Ninja"]
cmake.build-type = "RelWithDebInfo"
cmake.define = { BUILD_TESTING = "OFF", PAPI_BUILD_EXAMPLES = "OFF" }
wheel.packages = ["endstone_papi"]
install.components = ["python"]
install.strip = false

# Single version source: derive the wheel version from the CMake project() command
# so CMakeLists.txt is the only file that needs updating at release time.
[tool.scikit-build.metadata]
version.provider = "scikit_build_core.metadata.regex"
version.input = "CMakeLists.txt"
version.regex = "project\\([^)]*VERSION\\s+(?P<value>[0-9]+\\.[0-9]+\\.[0-9]+)"

[tool.scikit-build-core-conan]
config = ["tools.cmake.cmaketoolchain:generator=Ninja"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 120
lint.extend-select = ["I", "E", "F"]
# Endstone plugins describe commands and permissions as mutable class attributes; this
# is the documented convention, so the lint rule that would otherwise flag them is
# turned off for the plugin file alone.
lint.per-file-ignores = { "endstone_papi/plugin.py" = ["RUF012"] }
# The historical examples are replaced by the native core. They are excluded until the
# phase that rewrites them, so lint failures in code slated for deletion do not mask
# real problems.
extend-exclude = [
    "examples/python",
]

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*"]
skip = ["*-musllinux*", "*_i686", "*-win32"]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_34"
environment = { CC = "/usr/bin/clang-20", CXX = "/usr/bin/clang++-20" }
# Install Endstone before building so that tools/repair_wheel.py can discover
# the exact hashed SONAMEs in endstone.libs/ and build standard-SONAME bridge
# DSOs that forward to them. The runtime dependency is also declared in
# [project].dependencies, but we pin the exact build version for reproducibility.
before-build = "pip install ninja wheel endstone==0.11.8"
# Exclude libc++ and libc++abi from auditwheel bundling: _papi.so must use
# Endstone's single libc++ copy, not a duplicate that would segfault when both
# are loaded. tools/repair_wheel.py then creates no-implementation bridge DSOs
# whose hashed dependencies resolve from endstone.libs/. No import-time mutation
# of site-packages is needed.
repair-wheel-command = "python tools/repair_wheel.py {wheel} {dest_dir}"
before-all = [
    "dnf install -y clang cmake ninja-build python3-pip wget xz",
    "/usr/bin/clang-20 --version | tee /tmp/toolchain-provenance.txt",
    "/usr/bin/clang-20 --version | grep -E 'clang version 20\\.'",
    "rpm -q --qf 'clang_nvr=%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\\n' clang | tee -a /tmp/toolchain-provenance.txt",
    "rpm -q --qf '%{VERSION}' clang | grep -E '^20\\.'",
    "wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/llvm-project-20.1.8.src.tar.xz -O /tmp/llvm.tar.xz",
    "echo '6898f963c8e938981e6c4a302e83ec5beb4630147c7311183cf61069af16333d  /tmp/llvm.tar.xz' | sha256sum -c -",
    "tar xf /tmp/llvm.tar.xz -C /tmp",
    "cmake -B /tmp/libcxx-build -S /tmp/llvm-project-20.1.8.src/runtimes -G Ninja -DCMAKE_C_COMPILER=/usr/bin/clang-20 -DCMAKE_CXX_COMPILER=/usr/bin/clang++-20 -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_RUNTIMES='libcxx;libcxxabi' -DLIBCXX_CXX_ABI=libcxxabi -DLIBCXXABI_USE_LLVM_UNWINDER=OFF -DLIBCXX_ENABLE_EXPERIMENTAL_LIBRARY=OFF",
    "cmake --build /tmp/libcxx-build --target install-cxx install-cxxabi -- -j$(nproc)",
    "rm -rf /tmp/llvm.tar.xz /tmp/llvm-project-20.1.8.src /tmp/libcxx-build",
]

[tool.cibuildwheel.windows]
environment = { CC = "clang-cl", CXX = "clang-cl" }
